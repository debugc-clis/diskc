name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/diskc

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/diskc-linux-amd64 ./cmd/diskc
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/diskc-linux-arm64 ./cmd/diskc
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/diskc-darwin-amd64 ./cmd/diskc
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/diskc-darwin-arm64 ./cmd/diskc
